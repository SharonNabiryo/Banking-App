# Render Blueprint: https://render.com/docs/blueprint-spec
# New > Blueprint in the Render dashboard, pick this repo, and Render creates the web service.
# The database lives on Neon's always-free plan (https://neon.tech): paste its connection
# string as DATABASE_URL when Render asks.
services:
  - type: web
    name: copperleaf-bank
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: SEED_DEMO
        value: "true"
      - key: ADMIN_EMAILS
        sync: false
