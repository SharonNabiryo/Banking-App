# Render Blueprint: https://render.com/docs/blueprint-spec
# New > Blueprint in the Render dashboard, pick this repo, and Render creates both services.
services:
  - type: web
    name: copperleaf-bank
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: copperleaf-db
          property: connectionString
      - key: SEED_DEMO
        value: "true"
      - key: ADMIN_EMAILS
        sync: false

databases:
  - name: copperleaf-db
    plan: free
    databaseName: copperleaf
